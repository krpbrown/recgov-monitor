[project]
name = "recgov-monitor"
version = "0.1.0"
description = "Check recreation.gov campsite availability and post to Discord"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0.0"]

[project.scripts]
recgov-monitor = "recgov_monitor.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
