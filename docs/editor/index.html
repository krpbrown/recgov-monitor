<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>recgov-monitor config editor</title>
    <link rel="stylesheet" href="../styles.css?v=8" />
  </head>
  <body>
    <main class="container">
      <h1>recgov-monitor config editor</h1>

      <section class="card">
        <h2>GitHub source</h2>
        <div class="grid three">
          <label>Owner <input id="owner" value="krpbrown" /></label>
          <label>Repo <input id="repo" value="recgov-monitor" /></label>
          <label>Branch <input id="branch" value="main" /></label>
        </div>
        <div class="grid two">
          <label>Monitor path <input id="monitorPath" value="monitor.json" /></label>
          <label>Campgrounds path <input id="campgroundsPath" value="campgrounds.json" /></label>
        </div>
        <div class="grid two">
          <label>Tickets path <input id="ticketsPath" value="tickets.json" /></label>
          <label>Users path <input id="usersPath" value="users.json" /></label>
        </div>
        <div class="tokenRow">
          <label class="tokenLabel" for="token">GitHub token</label>
          <input
            id="token"
            type="password"
            placeholder="Fine-grained PAT"
            title="Token needs repository Contents: Read/Write for this repo. Token is only used in this browser tab."
          />
          <button id="loadBtn" class="actionBtn">Load from GitHub</button>
          <label class="rememberBox"><input id="rememberGithubToken" type="checkbox" /> Remember token</label>
        </div>
        <div class="tokenRow">
          <label class="tokenLabel" for="ridbApiKey">RIDB API key</label>
          <div id="ridbFieldWrap" class="fieldWithIndicator" title="RIDB: not tested">
            <input id="ridbApiKey" type="password" placeholder="for preview images" />
            <span id="ridbDot" class="indicatorDot" aria-hidden="true"></span>
          </div>
          <button id="testRidbBtn" type="button" class="actionBtn">Test RIDB key</button>
          <label class="rememberBox"><input id="rememberRidbKey" type="checkbox" /> Remember key</label>
        </div>
        <div class="row">
          <button id="clearSavedSecretsBtn" type="button">Clear saved credentials</button>
        </div>
      </section>

      <section id="campgroundsSection" class="card">
        <h2>Campgrounds</h2>
        <label>Search <input id="search" placeholder="name, id, park, state" /></label>
        <div class="lists">
          <div>
            <h3>Available</h3>
            <select id="availableList" class="campSelect" size="14" multiple></select>
          </div>
          <div class="listButtons">
            <button id="addBtn">Add &gt;&gt;</button>
            <button id="removeBtn">&lt;&lt; Remove</button>
          </div>
          <div>
            <h3>Current trip</h3>
            <select id="selectedList" class="campSelect" size="14" multiple></select>
          </div>
        </div>
        <div id="preview" class="preview"></div>
      </section>

      <section class="card">
        <h2>Trip group</h2>
        <div class="grid two">
          <label>Trip type
            <select id="tripType">
              <option value="campground">Campground</option>
              <option value="ticket">Ticketed tour/event</option>
            </select>
          </label>
        </div>
        <div class="grid two">
          <label>Check-in <input id="checkIn" type="date" /></label>
          <label>Check-out <input id="checkOut" type="date" /></label>
        </div>
        <div id="ticketControls" class="grid">
          <label>Search tickets <input id="ticketSearch" placeholder="ticket, park, id" /></label>
          <label>Ticket for this trip
            <select id="ticketSelect">
              <option value="">(select a ticket)</option>
            </select>
          </label>
        </div>
        <div class="grid">
          <label>Saved user
            <select id="tripUserSelect">
              <option value="">(custom / none)</option>
            </select>
          </label>
        </div>
        <div class="grid">
          <label>Discord tag for this trip (optional) <input id="discordTag" placeholder="&lt;@123456789012345678&gt; or numeric user ID" /></label>
        </div>
        <div class="row">
          <label><input id="fullMatchesOnly" type="checkbox" /> Full matches only (skip partial-only availability)</label>
        </div>
        <div class="row">
          <button id="newTripBtn">New trip</button>
          <button id="removeTripBtn">Remove trip</button>
          <button id="loadTripBtn">Load trip</button>
        </div>
        <select id="tripGroupsList" size="2"></select>
      </section>

      <section class="card">
        <h2>Saved Discord users</h2>
        <div class="grid two">
          <label>Name <input id="userNameInput" placeholder="Kris" /></label>
          <label>Discord ID <input id="userIdInput" placeholder="312027909042864130" /></label>
        </div>
        <div class="row">
          <button id="saveUserBtn" type="button">Add or update user</button>
          <button id="deleteUserBtn" type="button">Remove selected user</button>
          <button id="saveUsersRepoBtn" type="button">Save users file to GitHub</button>
        </div>
        <select id="savedUsersList" size="4"></select>
      </section>

      <section class="card actionCard">
        <p id="status">Ready.</p>
        <div class="submitRow">
          <button id="saveBtn">Save monitor.json to GitHub</button>
        </div>
      </section>
    </main>
    <script src="../app.js?v=17"></script>
  </body>
</html>
